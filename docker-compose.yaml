services:
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: unless-stopped

    environment:
      NODE_ENV: production

      HOSTNAME: "0.0.0.0"
      PORT: "20128"

      DATA_DIR: /app/data

      BASE_URL: "https://9router.web-father.ir"
      NEXT_PUBLIC_BASE_URL: "https://9router.web-father.ir"
      AUTH_COOKIE_SECURE: true

      JWT_SECRET: ${JWT_SECRET}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD}

      # Keep Node reasonable on a 512 MB VPS.
      NODE_OPTIONS: "--max-old-space-size=220"

    volumes:
      - 9router-data:/app/data

    expose:
      - "20128"

    mem_limit: 300m
    mem_reservation: 128m

    networks:
      - 9router-network

  warp-proxy:
    # Community image with the official WARP client in userspace proxy mode
    # and GOST for authenticated HTTP CONNECT/SOCKS5. No host ports or TUN.
    image: ghcr.io/foxy1402/warp-proxy-docker:latest
    restart: unless-stopped

    environment:
      PROXY_USER: ${WARP_PROXY_USER:?Set WARP_PROXY_USER in .env}
      PROXY_PASS: ${WARP_PROXY_PASSWORD:?Set WARP_PROXY_PASSWORD in .env}

    volumes:
      - warp-data:/var/lib/cloudflare-warp

    expose:
      - "8080"

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS --max-time 15 --proxy http://127.0.0.1:8080 --proxy-user "$${PROXY_USER}:$${PROXY_PASS}" https://www.cloudflare.com/cdn-cgi/trace | grep -Eq "^warp=(on|plus)$$"'
      interval: 30s
      timeout: 20s
      start_period: 180s
      retries: 3

    networks:
      - 9router-network

  caddy:
    image: caddy:2-alpine
    container_name: 9router-caddy
    restart: unless-stopped

    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

    mem_limit: 80m
    mem_reservation: 20m

    networks:
      - 9router-network

    depends_on:
      - 9router

volumes:
  9router-data:
  caddy-data:
  caddy-config:
  warp-data:

networks:
  9router-network:
    driver: bridge
